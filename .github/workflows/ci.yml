name: CI

# Раньше main покрывался деплоем (он тоже собирает и тестирует). Теперь деплой
# запускается вручную, поэтому CI гоняем на всех ветках, включая main.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и проверка типов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка behavior pack
        run: npm run build

      - name: Функциональные тесты движка
        run: node --import ./tests/register.mjs tests/engine.test.mjs

      - name: Проверка артефактов сборки
        run: |
          test -f addon/scripts/index.js || { echo "::error::addon/scripts/index.js не собран"; exit 1; }
          # Node.js API недоступны в QuickJS: их появление в бандле — ошибка сборки.
          if grep -rnE "from ['\"](node:|fs|path|http|https|crypto)['\"]" addon/scripts; then
            echo "::error::В скомпилированных скриптах найден импорт Node.js-модуля"
            exit 1
          fi
          echo "Собрано файлов: $(find addon/scripts -name '*.js' | wc -l)"
